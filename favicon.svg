<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c87f7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Brain-like network -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#grad1)" stroke-width="2"/>
  <circle cx="30" cy="35" r="8" fill="url(#grad1)" opacity="0.8"/>
  <circle cx="70" cy="35" r="8" fill="url(#grad1)" opacity="0.8"/>
  <circle cx="50" cy="65" r="10" fill="url(#grad1)" opacity="0.9"/>
  <circle cx="35" cy="55" r="6" fill="url(#grad1)" opacity="0.7"/>
  <circle cx="65" cy="55" r="6" fill="url(#grad1)" opacity="0.7"/>
  <!-- Connections -->
  <line x1="30" y1="35" x2="50" y2="65" stroke="url(#grad1)" stroke-width="1.5" opacity="0.5"/>
  <line x1="70" y1="35" x2="50" y2="65" stroke="url(#grad1)" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="35" x2="70" y2="35" stroke="url(#grad1)" stroke-width="1.5" opacity="0.5"/>
  <line x1="35" y1="55" x2="65" y2="55" stroke="url(#grad1)" stroke-width="1.5" opacity="0.5"/>
</svg>
